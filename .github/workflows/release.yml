name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Publishing steps are skipped until these secrets are set.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Test
        run: |
          go test ./...
          cd extension && npm ci && npm test

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: extension
        run: npx vsce publish --packagePath ../dist/*.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: extension
        run: |
          for vsix in ../dist/*.vsix; do
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
